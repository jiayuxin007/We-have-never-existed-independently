<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Ring - p5.js (mount demo, fullscreen)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas { display: block; }
        #stage { position: fixed; inset: 0; }
    </style>
</head>
<body>
    <div id="stage"></div>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.4.0/lib/p5.js"></script>
    <script src="particle-ring-embed.js"></script>
    <script>
        // 独立预览用：模拟主流程调用 mountParticleRing 的方式
        window.mountParticleRing({
            container: document.getElementById('stage')
        });
    </script>
</body>
</html>
