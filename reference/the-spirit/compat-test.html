<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>THREE version compat test v4 - full cycle</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; background: #111; }
        #stage { position: fixed; inset: 0; }
        #log { position: fixed; top: 0; left: 0; color: #0f0; font: 12px monospace; background: rgba(0,0,0,0.85); padding: 8px; z-index: 10; white-space: pre; max-width: 96vw; max-height: 95vh; overflow: auto; }
    </style>
</head>
<body>
    <div id="log">running...</div>
    <div id="stage"></div>
    <script>
        window.__log = [];
        var errCount = 0;
        var _origErr = console.error;
        console.error = function () {
            errCount++;
            window.__log.push('[console.error #' + errCount + '] ' + Array.prototype.slice.call(arguments).join(' '));
            _origErr.apply(console, arguments);
        };
        function render() { document.getElementById('log').textContent = window.__log.join('\n'); }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        window.__R128_THREE__ = window.THREE;
        window.__log.push('[house-1] 房屋模型阶段：THREE=r128 REVISION=' + THREE.REVISION);
        render();
    </script>
    <script src="js/three.r74.min.js"></script>
    <script>
        window.__R74_THREE__ = window.THREE; // 缓存一次即可，之后不用再重新加载脚本
        window.__log.push('[cache] 已缓存 r74 命名空间引用，REVISION=' + THREE.REVISION);
    </script>
    <script src="js/the-spirit-embed.js"></script>
    <script>
        window.__log.push('[cache] the-spirit-embed.js 已加载，mountTheSpirit=' + typeof window.mountTheSpirit);

        // 页面此刻默认停留在房屋模型该用的 r128
        window.THREE = window.__R128_THREE__;
        window.__log.push('[house-1] 恢复 THREE=r128，模拟房屋模型正常展示中');
        render();

        function enterSpirit(round, next) {
            window.THREE = window.__R74_THREE__;
            window.__log.push('[six-paths round ' + round + '] 切到 THREE=r74，mountTheSpirit()');
            var handle;
            try {
                handle = window.mountTheSpirit({ container: document.getElementById('stage') });
                window.__log.push('[six-paths round ' + round + '] mount 成功');
            } catch (e) {
                window.__log.push('[six-paths round ' + round + '] mount 抛错: ' + e.message);
            }
            render();

            setTimeout(function () {
                var errsBefore = errCount;
                handle.dispose();
                window.THREE = window.__R128_THREE__;
                window.__log.push('[six-paths round ' + round + '] dispose + 切回 THREE=r128 REVISION=' + THREE.REVISION
                    + '，本轮渲染期间 console.error 次数=' + errsBefore + '（期望 0）');
                render();
                next();
            }, 1500);
        }

        function backToHouse(round, next) {
            try {
                var geo = new THREE.BufferGeometry();
                geo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0], 3));
                var r = new THREE.WebGLRenderer({ antialias: true });
                var cam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
                var scn = new THREE.Scene();
                r.render(scn, cam);
                r.dispose();
                window.__log.push('[house-' + (round + 1) + '] 回到房屋模型，r128 渲染验证 OK');
            } catch (e) {
                window.__log.push('[house-' + (round + 1) + '] 回到房屋模型后 r128 渲染 THREW: ' + e.message);
            }
            render();
            next();
        }

        enterSpirit(1, function () {
            backToHouse(1, function () {
                enterSpirit(2, function () {
                    backToHouse(2, function () {
                        window.__log.push('[done] 完整两轮 house -> six-paths(the-spirit) -> house 循环结束，errCount=' + errCount + '（期望 0）');
                        render();
                    });
                });
            });
        });
    </script>
</body>
</html>
