<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hyper Mix - Three.js (mount demo)</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #1c2020; }
        body { position: relative; }
        canvas { display: block; }
        #stage { position: fixed; inset: 0; }
        .mobile, .logo, .instruction, .footer, .dg { display: none !important; }
    </style>
</head>
<body>
    <div class="mobile"></div>
    <div class="logo"></div>
    <div class="instruction"></div>
    <div class="footer"><span></span></div>
    <div id="stage"></div>

    <script>
        // 必须在加载 hyper-mix-embed.js 之前设置好 hash：settings 模块在脚本
        // 加载时就会读取一次 window.location.href 里的 hash 当 query 用。
        window.location.hash = '#amount=524k&motionBlurQuality=high';
    </script>
    <script src="js/three.r74.min.js"></script>
    <script src="js/hyper-mix-embed.js"></script>
    <script>
        // 独立预览用：模拟主流程调用 mountHyperMix 的方式
        window.mountHyperMix({
            container: document.getElementById('stage')
        });
    </script>
</body>
</html>
