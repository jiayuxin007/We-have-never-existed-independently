<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十二因缘预览 — 老项目效果</title>
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="../styles/main.css?v=11">
    <link rel="stylesheet" href="mingse-preview.css?v=10">
</head>
<body class="mingse-preview-page">
    <video id="previewBgVideo" class="layer global-bg-video" autoplay muted playsinline loop>
        <source src="../../assets/video/mixkit-flying-in-the-space-between-stars-and-nebulae-32973-hd-ready.mp4" type="video/mp4">
    </video>

    <div id="mingseStage" class="mingse-stage"></div>
    <p id="mingseSubtitle" class="mingse-subtitle">Apparition. Entangling into flesh and blood.</p>

    <div id="mingseHudBar" class="mingse-hud-bar" hidden>
        <div class="bar-hud">
            <span class="bar-hud-c tl"></span>
            <span class="bar-hud-c tr"></span>
            <span class="bar-hud-c bl"></span>
            <span class="bar-hud-c br"></span>
            <div class="bar-hud-fill" id="mingseHudFill"></div>
            <span class="mingse-hud-pct" id="mingseHudPct">0%</span>
        </div>
    </div>

    <header class="mingse-header">
        <p class="mingse-hint">老项目效果预览</p>
        <nav class="mingse-tabs" aria-label="因缘效果">
            <button type="button" data-effect="edge-slice" class="is-active">溶边切片</button>
            <button type="button" data-effect="wuming">无明</button>
            <button type="button" data-effect="xing">行</button>
            <button type="button" data-effect="shi">识</button>
            <button type="button" data-effect="mingse">名色</button>
            <button type="button" data-effect="liuru">六入</button>
            <button type="button" data-effect="chu">触</button>
            <button type="button" data-effect="shou-dukha">苦受</button>
            <button type="button" data-effect="shou-sukha">乐受</button>
            <button type="button" data-effect="shou-upeksha">舍受</button>
            <button type="button" data-effect="ai">爱</button>
            <button type="button" data-effect="qu">取</button>
            <button type="button" data-effect="qu-hud">业力条</button>
            <button type="button" data-effect="overload">过载</button>
            <button type="button" data-effect="collapse">坍缩</button>
            <button type="button" data-effect="burst">爆发</button>
            <button type="button" data-effect="dissolve">消散</button>
            <button type="button" data-effect="wave">波动</button>
            <button type="button" data-effect="reform">重组</button>
        </nav>
        <p id="mingseNote" class="mingse-note">
            贴图先溶边，点云再自下而上切片长出 · 16s 循环
        </p>
    </header>

    <aside class="mingse-controls">
        <button type="button" id="mingseReplay">重播</button>
        <p id="mingseStatus" class="mingse-status">加载中…</p>
    </aside>

    <script src="../effects/three-registry.js?v=3"></script>
    <script src="mingse-preview.js?v=61"></script>
</body>
</html>
