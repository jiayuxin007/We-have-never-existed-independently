<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ending Restart — 终句重开按钮</title>
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="../styles/main.css?v=19">
    <link rel="stylesheet" href="ending-restart-preview.css?v=6">
</head>
<body class="ending-preview-page">
    <video id="previewBgVideo" class="layer global-bg-video" autoplay muted playsinline loop>
        <source src="../../assets/video/mixkit-flying-in-the-space-between-stars-and-nebulae-32973-hd-ready.mp4" type="video/mp4">
    </video>

    <div id="finalQuoteStage" class="final-quote-stage">
        <div class="ending-stack">
            <p class="final-quote-text" id="endingQuote">No one stands alone; we are the particles of dust, sampled and shared in the air we breathe.</p>
            <div id="endingCta" class="ending-cta"></div>
        </div>
    </div>

    <p id="endingStatus" class="ending-status" hidden>已重新开始</p>

    <header class="ending-header">
        <p class="ending-kicker">Preview only · 不接入正式流程</p>
        <h1>终句 + 重开按钮</h1>
        <p class="ending-lead">中间是主流程那句终句。下面测结束时的重新开始。都偏安静、宇宙、尘、HUD，不走街机 Game Over。</p>
        <nav class="ending-tabs" id="endingTabs" aria-label="重开样式"></nav>
        <p class="ending-note" id="endingNote"></p>
    </header>

    <script src="ending-restart-preview.js?v=5"></script>
</body>
</html>
