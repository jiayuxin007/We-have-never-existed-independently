<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>We have never existed independently.</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="styles/main.css?v=17">
</head>
<body>
    <video id="globalBgVideo" class="layer global-bg-video" autoplay muted playsinline loop>
        <source src="../assets/video/mixkit-flying-in-the-space-between-stars-and-nebulae-32973-hd-ready.mp4" type="video/mp4">
    </video>

    <audio id="ambientAudio" class="ambient-audio-hidden" loop preload="auto" playsinline aria-hidden="true">
        <source src="../assets/audio/mars.mp3" type="audio/mpeg">
    </audio>

    <!-- Stage 0: intro + snowflake -->
    <div id="introScreen" class="intro-screen layer">
        <div class="intro-copy">
            <p class="intro-subtitle-line" id="introSubtitleLine" aria-live="polite"></p>
        </div>
        <div id="snowflake-cursor-container" class="snowflake-overlay">
            <canvas id="snowflakeCanvas"></canvas>
        </div>
    </div>

    <!-- Stage 1: Diamond Sutra -->
    <div id="sutraQuoteStage" class="sutra-quote-stage layer" hidden>
        <div class="sutra-quote-en-block" aria-label="English">
            <p class="sutra-en-line sutra-reveal-line">Neither the past, the present</p>
            <p class="sutra-en-line sutra-reveal-line">nor the future mind</p>
            <p class="sutra-en-line sutra-reveal-line">can be found.</p>
            <p class="sutra-en-attrib sutra-reveal-line">— The Diamond Sutra</p>
        </div>
        <div class="sutra-quote-cn-block" lang="zh-CN">
            <p class="sutra-cn-line sutra-reveal-line">过去心不可得</p>
            <p class="sutra-cn-line sutra-reveal-line">现在心不可得</p>
            <p class="sutra-cn-line sutra-reveal-line">未来心不可得</p>
            <p class="sutra-cn-attrib sutra-reveal-line">——金刚经</p>
        </div>
    </div>

    <div id="effectLayer" class="layer" hidden></div>
    <div id="houseLayer" class="layer" hidden></div>
    <div id="karmaHud" class="karma-hud" hidden>
        <div class="bar-hud">
            <span class="bar-hud-c tl"></span>
            <span class="bar-hud-c tr"></span>
            <span class="bar-hud-c bl"></span>
            <span class="bar-hud-c br"></span>
            <div class="bar-hud-fill" id="karmaBarFill"></div>
            <span class="karma-hud-pct" id="karmaBarPct">0%</span>
        </div>
        <p class="karma-hud-label" id="karmaText">Karma calculation in progress...</p>
    </div>
    <div id="subtitleLayer"></div>
    <div id="finalQuoteStage" class="final-quote-stage" hidden>
        <p class="final-quote-text">No one stands alone; we are the particles of dust, sampled and shared in the air we breathe.</p>
    </div>

    <div id="blockingLayer" class="layer" hidden data-mode=""></div>

    <script src="config/assets.config.js"></script>
    <script src="config/timing.config.js"></script>
    <script src="config/paths.config.js?v=5"></script>
    <script src="config/six-realms.config.js"></script>
    <script src="config/chart.config.js"></script>
    <script src="config/realm-assets.config.js?v=3"></script>
    <script src="config/stages.config.js?v=16"></script>

    <script src="karma/interaction-collector.js?v=2"></script>
    <script src="karma/six-paths-algorithm.js?v=3"></script>
    <script src="karma/market-ticker.js?v=2"></script>
    <script src="karma/karma-progress.js?v=4"></script>

    <script src="core/event-bus.js"></script>
    <script src="core/blocking-gate.js?v=2"></script>
    <script src="core/bg-video-controller.js"></script>
    <script src="core/subtitle-controller.js?v=2"></script>

    <script src="effects/three-registry.js?v=3"></script>
    <script src="effects/effect-registry.js?v=6"></script>

    <script src="house/house-model-stage.js?v=59"></script>
    <script src="ui/crosshair-cursor.js"></script>
    <script src="ui/note-audio.js?v=4"></script>
    <script src="ui/bgm-controller.js"></script>
    <script src="ui/snowflake-cursor.js?v=2"></script>
    <script src="ui/intro-controller.js"></script>
    <script src="ui/sutra-controller.js?v=2"></script>
    <script src="ui/final-quote-controller.js"></script>
    <script src="ui/blocking-ui.js"></script>
    <script src="ui/karma-pie-chart.js?v=7"></script>
    <script src="ui/karma-bar-chart.js?v=2"></script>
    <script src="ui/datav-border-box-1.js"></script>
    <script src="ui/karma-data-panel.js?v=13"></script>

    <script src="core/stage-director.js?v=12"></script>
    <script src="main.js?v=8"></script>
</body>
</html>
